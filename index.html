<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays com dados estáticos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class="flex items-center justify-between px-15 py-4 bg-orange-600">
        <div>
            <input type="text" placeholder="digite o nome do produto" class="w-120 h-10 rounded bg-white pl-4">
        </div>

        <div>
            <!-- ordenar preços -->
            <select id="categorias" class="h-10 rounded bg-white px-4">
                <option>"men's clothing"</option>
                <option>"jewelery"</option>
                <option>"electronics"</option>
                <option>"women's clothing"</option>
            </select>
            <!-- selecionar categoria -->
            <select id="ordenacao">
                <option value="preco">Ordenar por preço</option>
                <option value="nota">Ordenar por avaliação</option>
            </select>
        </div>
    </header>

    <main class="p-15 bg-slate-200">
        <div id="cards" class="grid grid-cols-4 gap-4">
            <div class="bg-white rounded p-4">
                <div class="relative">
                    <img src="https://fakestoreapi.com/img/61mtL65D4cL._AC_SX679_t.png" alt=""
                        class="w-full h-55 object-contain">
                    <div class="p-2 bg-orange-500 text-white font-bold absolute top-3 right-3 rounded">4.0</div>
                </div>

                <div>
                    <h2 class="font-semibold text-xl">Nome do produto</h2>
                    <h6 class="font-bold">Categoria</h6>
                    <h6 class="text-right text-2xl">R$ 00,00</h6>
                </div>
            </div>


        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
