<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrays com dados estáticos</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class="flex items-center justify-between px-15 py-4 bg-orange-600">
        <div>
            <input onkeyup="pesquisarProdutos(event.target.value)" type="text" placeholder="digite o nome do produto" class="w-120 h-10 rounded bg-white pl-4">
        </div>

        <div>
            <!-- ordenar preços -->
            <select id="categorias" onchange="filtrarProdutos(event.target.value)" class="h-10 rounded bg-white px-4">
                <option selected disabled>Filtrar categoria</option>
                <option>All</option>
                <option>men's clothing</option>
                <option>jewelery</option>
                <option>electronics</option>
                <option>women's clothing</option>
            </select>
            <!-- selecionar categoria -->
            <select onchange="ordenarProdutos(event.target.value)" class="h-10 rounded bg-white">
                <option selected disabled>Ordenar produtos</option>
                <option value="preco">Ordenar por preço</option>
                <option value="nota">Ordenar por avaliação</option>
            </select>
        </div>
    </header>

    <main class="p-15 bg-slate-200">
        <div id="cards" class="grid grid-cols-4 gap-4">
            
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
